# Required secure overlay for Compose deployment:
# docker compose -f compose.yaml -f compose.secrets.yaml up -d --build

services:
  app:
    environment:
      ADMIN_PASSWORD: ""
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SESSION_SECRET: ""
      SESSION_SECRET_FILE: /run/secrets/session_secret
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      EMBEDDING_API_KEY: ""
      EMBEDDING_API_KEY_FILE: /run/secrets/embedding_api_key
      WEB_SEARCH_API_KEY: ""
      WEB_SEARCH_API_KEY_FILE: /run/secrets/web_search_api_key
      BAILIAN_RESPONSES_FALLBACK_API_KEY: ""
      BAILIAN_RESPONSES_FALLBACK_API_KEY_FILE: /run/secrets/responses_api_key
    secrets:
      - admin_password
      - session_secret
      - llm_api_key
      - embedding_api_key
      - web_search_api_key
      - responses_api_key

secrets:
  admin_password:
    file: "${ADMIN_PASSWORD_SECRET_PATH:-./secrets/admin_password}"
  session_secret:
    file: "${SESSION_SECRET_SECRET_PATH:-./secrets/session_secret}"
  llm_api_key:
    file: "${LLM_API_KEY_SECRET_PATH:-./secrets/llm_api_key}"
  embedding_api_key:
    file: "${EMBEDDING_API_KEY_SECRET_PATH:-./secrets/embedding_api_key}"
  web_search_api_key:
    file: "${WEB_SEARCH_API_KEY_SECRET_PATH:-./secrets/web_search_api_key}"
  responses_api_key:
    file: "${BAILIAN_RESPONSES_FALLBACK_API_KEY_SECRET_PATH:-./secrets/responses_api_key}"
