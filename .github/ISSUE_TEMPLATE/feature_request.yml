name: Feature request
description: Propose a scoped capability or provider integration.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and data-flow impact
      description: Describe new credentials, outbound data, filesystem access, or write behavior.
    validations:
      required: true
