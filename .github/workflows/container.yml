name: Container image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable emulated architectures
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive public image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kygoyuan2004/second-mind
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Build candidate image from the allowlisted context
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kygoyuan2004/second-mind:candidate-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Verify SDK and media on both container architectures
        env:
          CANDIDATE: ghcr.io/kygoyuan2004/second-mind@${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --read-only \
              --tmpfs /tmp:rw,nosuid,size=768m \
              --mount type=bind,source="$GITHUB_WORKSPACE/test",target=/app/test,readonly \
              --env KNOWLEDGE_BASE_ALLOWED_ROOTS= --workdir /app \
              "$CANDIDATE" node --test test/sdk-provider-matrix.test.mjs
            docker run --rm --platform "$platform" --read-only "$CANDIDATE" \
              /opt/media/bin/python -c 'import av, ctranslate2, faster_whisper, yt_dlp; print("media imports passed")'
            docker run --rm --platform "$platform" --read-only "$CANDIDATE" ffmpeg -version
          done
      - name: Promote the verified digest to release tags
        env:
          CANDIDATE: ghcr.io/kygoyuan2004/second-mind@${{ steps.image.outputs.digest }}
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -Eeuo pipefail
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          docker buildx imagetools create "${tags[@]}" "$CANDIDATE"
