services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${SECOND_MIND_IMAGE:-ghcr.io/kygoyuan2004/second-mind:latest}"
    restart: unless-stopped
    init: true
    user: "${VAULTMIND_UID:-1000}:${VAULTMIND_GID:-1000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      APP_NAME: "${APP_NAME:-Second Mind}"
      VAULT_LABEL: "${VAULT_LABEL:-My Obsidian Vault}"
      TIMEZONE: "${TIMEZONE:-UTC}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SECURE_COOKIE: "${SECURE_COOKIE:-false}"
      VAULT_PATH: /vaults
      KNOWLEDGE_BASE_ALLOWED_ROOTS: /vaults
      DATA_DIR: /app/data
      PUBLIC_DIR: /app/public
      INDEX_DIR: /app/data/index
      DRAFT_DIR: /app/data/drafts
      RECOVERY_DIR: /app/data/recovery
      CONVERSATION_FILE: /app/data/conversations.json
      AUDIT_FILE: /app/data/audit.jsonl
      VAULT_AUTO_CREATE_PATHS: "${VAULT_AUTO_CREATE_PATHS:-true}"
      DIARY_DIR: "${DIARY_DIR:-Second-Mind/Diary}"
      PLAN_DIR: "${PLAN_DIR:-Second-Mind/Plans}"
      SCRATCH_DIR: "${SCRATCH_DIR:-Second-Mind/Inbox}"
      DIARY_TEMPLATE: "${DIARY_TEMPLATE:-}"
      PLAN_TEMPLATE: "${PLAN_TEMPLATE:-}"
      VAULT_EXCLUDED_PATHS: "${VAULT_EXCLUDED_PATHS:-.obsidian,.trash,.git,.sync,.livesync,node_modules}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-43200}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai-compatible}"
      LLM_API_BASE: "${LLM_API_BASE:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-120000}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-3000}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.2}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-disabled}"
      EMBEDDING_API_BASE: "${EMBEDDING_API_BASE:-}"
      EMBEDDING_ENDPOINT: "${EMBEDDING_ENDPOINT:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nomic-embed-text}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-768}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-16}"
      EMBEDDING_TIMEOUT_MS: "${EMBEDDING_TIMEOUT_MS:-30000}"
      ALLOW_INSECURE_PROVIDER_HTTP: "${ALLOW_INSECURE_PROVIDER_HTTP:-false}"
      WEB_SEARCH_ENABLED: "${WEB_SEARCH_ENABLED:-false}"
      WEB_SEARCH_TIMEOUT_MS: "${WEB_SEARCH_TIMEOUT_MS:-60000}"
      WEB_SEARCH_RESULT_COUNT: "${WEB_SEARCH_RESULT_COUNT:-15}"
      WEB_SEARCH_DEEP_RESULT_COUNT: "${WEB_SEARCH_DEEP_RESULT_COUNT:-6}"
      WEB_SEARCH_MAX_RESULTS_PER_DOMAIN: "${WEB_SEARCH_MAX_RESULTS_PER_DOMAIN:-2}"
      WEB_SEARCH_MODEL_SOURCE_LIMIT: "${WEB_SEARCH_MODEL_SOURCE_LIMIT:-10}"
      WEB_SEARCH_MAX_CONTEXT_CHARS: "${WEB_SEARCH_MAX_CONTEXT_CHARS:-30000}"
      WEB_SEARCH_OFFICIAL_DOMAINS: "${WEB_SEARCH_OFFICIAL_DOMAINS:-}"
      QA_CONTEXTUALIZER_ENABLED: "${QA_CONTEXTUALIZER_ENABLED:-false}"
      QA_CONTEXTUALIZER_TIMEOUT_MS: "${QA_CONTEXTUALIZER_TIMEOUT_MS:-45000}"
      QA_RESEARCH_LOOP_ENABLED: "${QA_RESEARCH_LOOP_ENABLED:-false}"
      QA_EVIDENCE_TIMEOUT_MS: "${QA_EVIDENCE_TIMEOUT_MS:-60000}"
      WEB_READER_ENABLED: "${WEB_READER_ENABLED:-false}"
      PDF_ENABLED: "${PDF_ENABLED:-false}"
      WEB_READER_PAGE_TIMEOUT_MS: "${WEB_READER_PAGE_TIMEOUT_MS:-15000}"
      WEB_READER_BATCH_TIMEOUT_MS: "${WEB_READER_BATCH_TIMEOUT_MS:-40000}"
      WEB_READER_HTML_MAX_BYTES: "${WEB_READER_HTML_MAX_BYTES:-2097152}"
      WEB_READER_PDF_MAX_BYTES: "${WEB_READER_PDF_MAX_BYTES:-8388608}"
      WEB_READER_PAGE_MAX_CHARS: "${WEB_READER_PAGE_MAX_CHARS:-16000}"
      WEB_READER_TOTAL_MAX_CHARS: "${WEB_READER_TOTAL_MAX_CHARS:-40000}"
      WEB_READER_CONCURRENCY: "${WEB_READER_CONCURRENCY:-2}"
      WEB_READER_MAX_PAGES_PER_BATCH: "${WEB_READER_MAX_PAGES_PER_BATCH:-3}"
      WEB_READER_NORMAL_MAX_PAGES: "${WEB_READER_NORMAL_MAX_PAGES:-2}"
      WEB_READER_DEEP_MAX_PAGES_PER_ROUND: "${WEB_READER_DEEP_MAX_PAGES_PER_ROUND:-3}"
      WEB_READER_MAX_REDIRECTS: "${WEB_READER_MAX_REDIRECTS:-3}"
      BAILIAN_RESPONSES_FALLBACK_ENABLED: "${BAILIAN_RESPONSES_FALLBACK_ENABLED:-false}"
      BAILIAN_RESPONSES_FALLBACK_API_BASE: "${BAILIAN_RESPONSES_FALLBACK_API_BASE:-}"
      BAILIAN_RESPONSES_FALLBACK_MODEL: "${BAILIAN_RESPONSES_FALLBACK_MODEL:-qwen3.8-max}"
      BAILIAN_RESPONSES_FALLBACK_TIMEOUT_MS: "${BAILIAN_RESPONSES_FALLBACK_TIMEOUT_MS:-120000}"
      BAILIAN_RESPONSES_FALLBACK_MAX_RESPONSE_BYTES: "${BAILIAN_RESPONSES_FALLBACK_MAX_RESPONSE_BYTES:-2097152}"
      RAG_TOP_K: "${RAG_TOP_K:-8}"
      RAG_MAX_CONTEXT_CHARS: "${RAG_MAX_CONTEXT_CHARS:-30000}"
      DEEP_TASKS_ENABLED: "${DEEP_TASKS_ENABLED:-true}"
      RAG_DEEP_TOP_K: "${RAG_DEEP_TOP_K:-16}"
      INDEX_WATCH: "${INDEX_WATCH:-true}"
      INDEX_RECONCILE_SECONDS: "${INDEX_RECONCILE_SECONDS:-300}"
      MAX_JSON_BODY_BYTES: "${MAX_JSON_BODY_BYTES:-25165824}"
      MAX_ATTACHMENT_COUNT: "${MAX_ATTACHMENT_COUNT:-8}"
      MAX_ATTACHMENT_BYTES: "${MAX_ATTACHMENT_BYTES:-5242880}"
      MAX_ATTACHMENT_TOTAL_BYTES: "${MAX_ATTACHMENT_TOTAL_BYTES:-15728640}"
      RECOVERY_RETENTION_DAYS: "${RECOVERY_RETENTION_DAYS:-30}"
      SYNC_PROVIDER: "${SYNC_PROVIDER:-filesystem}"
      SYNC_DISPLAY_NAME: "${SYNC_DISPLAY_NAME:-Filesystem}"
    ports:
      - "${VAULTMIND_BIND_IP:-127.0.0.1}:${VAULTMIND_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vaultmind-data:/app/data
      - type: bind
        source: "${KNOWLEDGE_BASE_HOST_PATH:-./vault}"
        target: /vaults
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 10

volumes:
  vaultmind-data:
