name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare reproducible isolated browser gate
        shell: bash
        env:
          CHROME_FOR_TESTING_SHA256: 99f05b875209cdbf7490dc431a525fd373788521fb9e8aca68c761fc5fc400e5
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/chrome-for-testing-134.0.6998.88.zip"
          browser_root="${RUNNER_TEMP}/chrome-for-testing-134.0.6998.88"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 4 --retry-all-errors \
            --output "$archive" \
            https://storage.googleapis.com/chrome-for-testing-public/134.0.6998.88/linux64/chrome-linux64.zip
          printf '%s  %s\n' "$CHROME_FOR_TESTING_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$browser_root"
          unzip -q "$archive" -d "$browser_root"
          browser="${browser_root}/chrome-linux64/chrome"
          test -x "$browser"
          echo "SECOND_MIND_TEST_CHROME=$browser" >> "$GITHUB_ENV"

      - name: Run application release checks
        run: npm run verify

      - name: Install screenshot OCR language data
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim

      - name: Scan canonical screenshots with OCR
        run: npm run security:ocr

      - name: Build and validate static site
        run: npm run site:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
