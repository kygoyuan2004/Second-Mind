<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" fill="none">
  <title>A cited line in a stack of Markdown notes</title>
  <style>
    svg { --ink:#253a4a; --line:#8195a2; --blue:#0a58ca; --paper:#fffefa; --edge:#e4e9e9; --grid:#b8c7ce; --wash:#eef2f1; --tag:#e9f2ff; }
    @media (prefers-color-scheme:dark) {
      svg { --ink:#dbe8f4; --line:#819aa8; --blue:#84bcff; --paper:#243039; --edge:#18262f; --grid:#4a6170; --wash:#15212a; --tag:#192f48; }
    }
    .mono { font:12px ui-monospace,Consolas,monospace; fill:var(--ink); }
    .edge { stroke:var(--ink); stroke-width:1.3; stroke-linejoin:round; }
    .wire { stroke:var(--blue); stroke-width:1.15; stroke-linejoin:round; }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="var(--grid)" opacity=".43" stroke-width=".65"/>
    </pattern>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0 0V4" stroke="var(--line)" stroke-width="1.3"/>
    </pattern>
    <g id="leaf">
      <path d="M0 0H175L198 23V150H0Z" fill="var(--paper)" class="edge"/>
      <path d="M175 0V23H198" class="edge"/>
      <path d="M19 28H112M19 38H139M19 62H156M19 72H164M19 82H134M19 106H116M19 116H151" stroke="var(--line)" stroke-width="2"/>
    </g>
  </defs>
  <rect x="14" y="12" width="552" height="322" rx="2" fill="url(#grid)"/>
  <path d="M12 22V11H23M556 11H567V22M12 324V335H23M556 335H567V324" stroke="var(--line)"/>
  <path d="M95 230 318 307 461 224 240 153Z" fill="var(--grid)" opacity=".24"/>
  <g transform="matrix(1.13 .39 -.87 .55 229 158)">
    <path d="M-8 -8H209V164H-8Z" fill="var(--edge)" class="edge"/>
    <path d="M-8 156H209V164H-8Z" fill="url(#hatch)" class="edge"/>
    <use href="#leaf"/>
  </g>
  <g transform="matrix(1.13 .39 -.87 .55 225 132)"><use href="#leaf"/></g>
  <g transform="matrix(1.13 .39 -.87 .55 222 104)">
    <path d="M0 0H175L198 23V150H0Z" fill="var(--paper)" class="edge"/>
    <path d="M175 0V23H198" class="edge"/>
    <text x="17" y="30" fill="var(--ink)" font-family="Georgia,serif" font-size="22" font-weight="bold">Field notes</text>
    <path d="M18 42H143M18 52H115M18 80H158M18 91H143M18 103H104M18 124H139" stroke="var(--line)" stroke-width="2.3"/>
    <path d="m15 62 145 -1 -2 12 -145 1Z" fill="#f9e76d"/>
    <path d="M18 68H148" stroke="#594729" stroke-width="2.1"/>
    <path d="M163 61h17v13h-17z" fill="var(--tag)" class="wire"/>
    <text x="165" y="71" fill="var(--blue)" font-family="monospace" font-size="10">1</text>
  </g>
  <g stroke="var(--line)" stroke-dasharray="2 5">
    <path d="M93 187v47M419 172v52M222 104V70"/>
  </g>
  <circle cx="358" cy="208" r="4" fill="var(--blue)" stroke="var(--paper)" stroke-width="1.5"/>
  <path d="M358 208h64l28 -24h40" class="wire"/>
  <rect x="454" y="171" width="72" height="24" rx="3" fill="var(--tag)" class="wire"/>
  <text x="464" y="187" class="mono">[1] L05</text>
  <path d="M147 162h-27l-17 -17H62" stroke="var(--line)" stroke-dasharray="3 3"/>
  <text x="56" y="136" class="mono">Vault/</text>
  <g transform="translate(233 32) rotate(-4 80 30)">
    <rect x="3" y="5" width="153" height="48" rx="3" fill="var(--edge)" stroke="var(--line)"/>
    <rect width="153" height="48" rx="3" fill="var(--paper)" class="edge"/>
    <text x="11" y="20" class="mono">research.md</text>
    <rect x="11" y="29" width="99" height="8" fill="#f9e76d"/>
    <path d="M13 33h91" stroke="#725b20"/>
    <text x="123" y="34" class="mono">[1]</text>
  </g>
  <path d="M307 90v25l-16 10" class="wire" stroke-dasharray="3 4"/>
</svg>
